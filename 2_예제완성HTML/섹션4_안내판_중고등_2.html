<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3차시 · 힘의 종류</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 폰트 및 최소 글자 크기 보장 (32px 이상 요구사항 유지) */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            font-size: 32px;
            line-height: 1.4;
            background-color: #ffffff;
            color: #0f172a; /* 진한 남색계열 */
        }
        
        /* 글자 크기 정의 */
        .text-24 { font-size: 24px; }
        .text-32 { font-size: 32px; }
        .text-36 { font-size: 36px; }
        .text-44 { font-size: 44px; }

        /* 진한 남색 Custom Color */
        .bg-navy { background-color: #0f172a; }
        .text-navy { color: #0f172a; }
        .border-navy { border-color: #0f172a; }

        /* 커스텀 체크박스 스타일링 (태블릿에서도 터치하기 쉽도록 크게 제작) */
        .custom-checkbox-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .custom-checkbox-box {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border: 4px solid #64748b; /* 회색 테두리 */
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            background-color: #ffffff;
        }

        /* 체크 시: 진한 남색 배경과 흰색 체크 표시 */
        .custom-checkbox-input:checked + .custom-checkbox-box {
            background-color: #0f172a;
            border-color: #0f172a;
        }

        .custom-checkbox-input:checked + .custom-checkbox-box::after {
            content: '✓';
            color: #ffffff;
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8 max-w-4xl mx-auto justify-between bg-white text-navy selection:bg-slate-200">

    <!-- [위] 차시 제목 및 오늘의 목표 -->
    <header class="w-full space-y-3">
        <!-- 차시 제목 (작게 표시) -->
        <div class="inline-block text-24 font-semibold text-slate-600 bg-slate-100 px-4 py-1 rounded-md">
            3차시 · 힘의 종류
        </div>
        
        <!-- 맨 위에 크게 보여주는 오늘의 목표 (가장 크게 한 문장) -->
        <div class="bg-navy text-white p-6 sm:p-8 rounded-2xl shadow-sm">
            <div class="text-24 font-normal text-slate-300 mb-2">오늘의 목표</div>
            <div class="text-36 sm:text-44 font-bold leading-tight">
                생활 속 힘을 중력·탄성력·마찰력으로 나누어 설명할 수 있다
            </div>
        </div>
    </header>

    <!-- [가운데] 오늘 할 일 목록 3개 -->
    <main class="w-full my-6">
        <section class="bg-white">
            <h2 class="text-36 font-bold text-navy mb-4">
                오늘 할 일
            </h2>
            <ol class="space-y-3">
                <li class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-300 text-32 gap-2">
                    <div class="flex items-center gap-3">
                        <span class="flex items-center justify-center w-10 h-10 rounded-lg bg-slate-200 font-bold text-slate-800 text-24">1</span>
                        <span class="font-semibold text-slate-900">사진 속에서 힘 찾기</span>
                    </div>
                    <span class="text-slate-600 text-24 font-medium self-end sm:self-center bg-slate-200 px-3 py-1 rounded-md">10분</span>
                </li>
                <li class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-300 text-32 gap-2">
                    <div class="flex items-center gap-3">
                        <span class="flex items-center justify-center w-10 h-10 rounded-lg bg-slate-200 font-bold text-slate-800 text-24">2</span>
                        <span class="font-semibold text-slate-900">모둠별로 힘을 나누어 정리하기</span>
                    </div>
                    <span class="text-slate-600 text-24 font-medium self-end sm:self-center bg-slate-200 px-3 py-1 rounded-md">20분</span>
                </li>
                <li class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-300 text-32 gap-2">
                    <div class="flex items-center gap-3">
                        <span class="flex items-center justify-center w-10 h-10 rounded-lg bg-slate-200 font-bold text-slate-800 text-24">3</span>
                        <span class="font-semibold text-slate-900">내 말로 설명 쓰기</span>
                    </div>
                    <span class="text-slate-600 text-24 font-medium self-end sm:self-center bg-slate-200 px-3 py-1 rounded-md">10분</span>
                </li>
            </ol>
        </section>

        <!-- 할 일 목록과 체크리스트 사이의 얇은 구분선 -->
        <hr class="my-8 border-t border-slate-300" />

        <!-- [아래] 평가 기준 체크리스트 3개 -->
        <section class="bg-white">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-36 font-bold text-navy">
                    스스로 확인하기
                </h2>
                <!-- 순위표 대신 다시 하기 버튼 -->
                <button 
                    type="button"
                    onclick="resetChecklist()"
                    class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 text-24 font-bold px-5 py-2 rounded-xl border border-slate-400 transition-colors"
                >
                    다시 하기
                </button>
            </div>

            <!-- 미완료 시 오류 피드백 (한 줄 메시지) -->
            <div id="errorMessage" class="hidden mb-4 p-3 rounded-xl bg-slate-100 text-slate-800 border-2 border-slate-400 text-24 font-bold text-center"></div>

            <ul class="space-y-3">
                <!-- 체크 항목 1 (label로 전체 감싸기) -->
                <li>
                    <label class="flex items-start sm:items-center gap-4 p-4 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 cursor-pointer text-32 transition-colors select-none">
                        <input type="checkbox" class="custom-checkbox-input" onchange="checkStatusChanged()">
                        <span class="custom-checkbox-box mt-1 sm:mt-0"></span>
                        <span class="font-medium text-slate-900">중력·탄성력·마찰력마다 생활 속 예를 하나씩 썼다</span>
                    </label>
                </li>
                <!-- 체크 항목 2 -->
                <li>
                    <label class="flex items-start sm:items-center gap-4 p-4 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 cursor-pointer text-32 transition-colors select-none">
                        <input type="checkbox" class="custom-checkbox-input" onchange="checkStatusChanged()">
                        <span class="custom-checkbox-box mt-1 sm:mt-0"></span>
                        <span class="font-medium text-slate-900">근거를 두 개 이상 썼다</span>
                    </label>
                </li>
                <!-- 체크 항목 3 -->
                <li>
                    <label class="flex items-start sm:items-center gap-4 p-4 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 cursor-pointer text-32 transition-colors select-none">
                        <input type="checkbox" class="custom-checkbox-input" onchange="checkStatusChanged()">
                        <span class="custom-checkbox-box mt-1 sm:mt-0"></span>
                        <span class="font-medium text-slate-900">친구의 설명을 듣고 고칠 점을 하나 찾았다</span>
                    </label>
                </li>
            </ul>
        </section>
    </main>

    <!-- 단순 체크 및 오류 시 이유 한 줄 안내 script -->
    <script>
        const errorReasons = [
            "첫 번째 항목(힘마다 생활 속 예 쓰기)을 확인하지 않았습니다.",
            "두 번째 항목(근거 2개 이상 쓰기)을 확인하지 않았습니다.",
            "세 번째 항목(친구 설명에서 고칠 점 찾기)을 확인하지 않았습니다."
        ];

        function checkStatusChanged() {
            const checkboxes = document.querySelectorAll('.custom-checkbox-input');
            const errorEl = document.getElementById('errorMessage');
            
            let missingIndex = -1;
            let checkedCount = 0;

            checkboxes.forEach((cb, index) => {
                if (!cb.checked && missingIndex === -1) {
                    missingIndex = index;
                }
                if (cb.checked) {
                    checkedCount++;
                }
            });

            // 일부만 체크되었을 때 왜 다 끝나지 않았는지 한 줄로 알려줌
            if (checkedCount > 0 && checkedCount < checkboxes.length) {
                errorEl.textContent = errorReasons[missingIndex];
                errorEl.classList.remove('hidden');
            } else if (checkedCount === checkboxes.length) {
                errorEl.textContent = "오늘의 모든 배움 목표 확인을 완료했습니다!";
                errorEl.classList.remove('hidden');
            } else {
                errorEl.classList.add('hidden');
            }
        }

        // 다시 하기 기능
        function resetChecklist() {
            const checkboxes = document.querySelectorAll('.custom-checkbox-input');
            checkboxes.forEach(cb => {
                cb.checked = false;
            });
            document.getElementById('errorMessage').classList.add('hidden');
        }
    </script>
</body>
</html>
