<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3학년 수학 - 분수와 크기 비교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@600;800;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', 'Gowun Dodum', sans-serif;
            background-color: #f8fafc;
            overflow: hidden; /* 스크롤 없이 한 화면 고정 */
            user-select: none;
        }

        /* 큰 버튼 스타일 (최소 2cm 이상 - 약 80px 이상) */
        .large-btn {
            min-width: 100px;
            min-height: 80px;
            font-size: 32px;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transition: all 0.1s ease;
        }

        .large-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        /* 분수 형태 표현 (분자 위, 분모 아래, 가로선) */
        .fraction-display {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: 900;
            line-height: 1.1;
            padding: 0 20px;
        }

        .fraction-numerator {
            border-bottom: 8px solid #1e293b;
            width: 100%;
            text-align: center;
            padding-bottom: 4px;
        }

        .fraction-denominator {
            padding-top: 4px;
            text-align: center;
            width: 100%;
        }

        /* 막대 애니메이션 및 디자인 */
        .bar-container {
            border: 6px solid #334155;
            border-radius: 16px;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
        }

        .bar-segment {
            border-right: 4px dashed #94a3b8;
            transition: background-color 0.2s ease;
        }

        .bar-segment:last-child {
            border-right: none;
        }

        .filled {
            background-color: #3b82f6; /* 명확한 파란색 */
        }

        .filled-compare {
            background-color: #f59e0b; /* 비교용 주황색 */
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-6 bg-slate-50 text-slate-800">

    <!-- [위] 오늘의 학습 목표 (32px 이상, 한 문장) -->
    <header class="w-full text-center bg-amber-200 border-4 border-amber-400 rounded-2xl py-4 px-6">
        <h1 class="text-[36px] font-black text-amber-950 tracking-tight">
            목표: 막대를 보고 분수를 읽고, 두 분수의 크기를 비교할 수 있어요
        </h1>
    </header>

    <!-- [가운데] 분수 표현, 읽는 말, 설명, 가로 막대 -->
    <main class="flex-1 flex flex-col justify-center items-center my-2 gap-4">
        
        <!-- 분수 숫자 + 읽는 말 + 칸 설명 영역 -->
        <div class="flex items-center justify-center gap-10">
            <!-- 분수 (분자 위, 분모 아래) -->
            <div class="fraction-display text-slate-900" id="fractionDisplay">
                <div class="fraction-numerator" id="numeratorText">3</div>
                <div class="fraction-denominator" id="denominatorText">4</div>
            </div>

            <!-- 읽는 말 및 칸 설명 -->
            <div class="flex flex-col justify-center gap-2">
                <div class="text-[52px] font-black text-blue-700 bg-blue-50 border-2 border-blue-200 px-6 py-2 rounded-2xl" id="readText">
                    4분의 3
                </div>
                <div class="text-[36px] font-bold text-slate-600 pl-2" id="explainText">
                    4칸 중 3칸을 칠했어요
                </div>
            </div>
        </div>

        <!-- 가로로 긴 막대 (메인 막대) -->
        <div class="w-full max-w-5xl h-28 bar-container flex relative mt-2" id="mainBar">
            <!-- JS로 칸을 나눔 -->
        </div>

        <!-- 비교 모드용 두 번째 막대 (비교 시에만 표시됨) -->
        <div id="compareBarContainer" class="w-full max-w-5xl h-20 bar-container flex relative hidden">
            <!-- JS로 비교 칸을 나눔 -->
        </div>

        <!-- 피드백 / 안내 한 줄 메시지 (32px 이상) -->
        <div id="messageBox" class="text-[32px] font-bold text-red-600 h-10 flex items-center justify-center">
            <!-- 오류 시 한 줄 안내 문구 출력 -->
        </div>
    </main>

    <!-- [아래] 조작 버튼 영역 (가로세로 2cm 이상, 32px 이상 글자) -->
    <footer class="w-full flex justify-center items-center gap-4 py-2">
        <!-- 분모 - / + -->
        <button onclick="changeDenominator(-1)" class="large-btn bg-rose-500 hover:bg-rose-600 text-white border-b-8 border-rose-700">
            분모 −
        </button>
        <button onclick="changeDenominator(1)" class="large-btn bg-rose-500 hover:bg-rose-600 text-white border-b-8 border-rose-700">
            분모 +
        </button>

        <div class="w-4"></div> <!-- 여백 -->

        <!-- 분자 - / + -->
        <button onclick="changeNumerator(-1)" class="large-btn bg-sky-500 hover:bg-sky-600 text-white border-b-8 border-sky-700">
            분자 −
        </button>
        <button onclick="changeNumerator(1)" class="large-btn bg-sky-500 hover:bg-sky-600 text-white border-b-8 border-sky-700">
            분자 +
        </button>

        <div class="w-4"></div> <!-- 여백 -->

        <!-- 크기 비교 모드 토글 -->
        <button onclick="toggleCompareMode()" id="compareBtn" class="large-btn bg-emerald-500 hover:bg-emerald-600 text-white border-b-8 border-emerald-700 px-4">
            크기 비교
        </button>

        <!-- 다시 하기 버튼 -->
        <button onclick="resetToDefault()" class="large-btn bg-slate-600 hover:bg-slate-700 text-white border-b-8 border-slate-800">
            다시 하기
        </button>
    </footer>

    <script>
        // 한국어 수 읽기 배열
        const numToKorean = ["영", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구", "십"];

        // 상태 변수 (기본값: 4분의 3)
        let denominator = 4; // 분모
        let numerator = 3;   // 분자

        // 비교용 상태 변수 (기본값: 4분의 2)
        let isCompareMode = false;
        let compareDenominator = 4;
        let compareNumerator = 2;

        // 화면 요소 참조
        const denominatorText = document.getElementById('denominatorText');
        const numeratorText = document.getElementById('numeratorText');
        const readText = document.getElementById('readText');
        const explainText = document.getElementById('explainText');
        const mainBar = document.getElementById('mainBar');
        const compareBarContainer = document.getElementById('compareBarContainer');
        const messageBox = document.getElementById('messageBox');
        const compareBtn = document.getElementById('compareBtn');

        // 화면 업데이트 함수
        function updateUI() {
            // 숫자 업데이트
            denominatorText.textContent = denominator;
            numeratorText.textContent = numerator;

            // 한글 읽기 및 설명 업데이트
            const denKor = numToKorean[denominator] || denominator;
            const numKor = numToKorean[numerator] || numerator;

            readText.textContent = `${denKor}분의 ${numKor}`;
            explainText.textContent = `${denominator}칸 중 ${numerator}칸을 칠했어요`;

            // 메인 막대 그리기
            renderBar(mainBar, denominator, numerator, 'filled');

            // 크기 비교 모드 세팅
            if (isCompareMode) {
                compareBarContainer.classList.remove('hidden');
                renderBar(compareBarContainer, compareDenominator, compareNumerator, 'filled-compare');
            } else {
                compareBarContainer.classList.add('hidden');
            }
        }

        // 막대 그리기 전용 함수
        function renderBar(container, den, num, fillClass) {
            container.innerHTML = '';
            for (let i = 0; i < den; i++) {
                const segment = document.createElement('div');
                segment.className = `flex-1 h-full bar-segment ${i < num ? fillClass : ''}`;
                container.appendChild(segment);
            }
        }

        // 경고 메시지 표시 (한 줄 안내)
        function showMessage(msg) {
            messageBox.textContent = msg;
            setTimeout(() => {
                messageBox.textContent = '';
            }, 3000);
        }

        // 분모 변경 함수
        function changeDenominator(delta) {
            const nextDen = denominator + delta;

            if (nextDen < 2) {
                showMessage("분모는 2보다 작아질 수 없어요.");
                return;
            }
            if (nextDen > 10) {
                showMessage("초등학교 3학년 과정에서는 10까지만 나눌 수 있어요.");
                return;
            }
            if (numerator > nextDen) {
                // 분모가 줄어들 때 분자가 분모보다 크면 맞춰서 감소
                numerator = nextDen;
            }

            denominator = nextDen;
            updateUI();
        }

        // 분자 변경 함수
        function changeNumerator(delta) {
            const nextNum = numerator + delta;

            if (nextNum < 0) {
                showMessage("칠한 칸은 0보다 작을 수 없어요.");
                return;
            }
            if (nextNum > denominator) {
                showMessage(`전체가 ${denominator}칸이라서 ${denominator}칸까지만 칠할 수 있어요.`);
                return;
            }

            numerator = nextNum;
            updateUI();
        }

        // 비교 모드 토글
        function toggleCompareMode() {
            isCompareMode = !isCompareMode;
            if (isCompareMode) {
                compareBtn.classList.replace('bg-emerald-500', 'bg-amber-500');
                compareBtn.classList.replace('border-emerald-700', 'border-amber-700');
                compareBtn.textContent = '비교 끄기';
                compareDenominator = denominator; // 같은 분모로 시작
                compareNumerator = Math.max(1, numerator - 1);
            } else {
                compareBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
                compareBtn.classList.replace('border-amber-700', 'border-emerald-700');
                compareBtn.textContent = '크기 비교';
            }
            updateUI();
        }

        // [다시 하기] 버튼 동작 (4분의 3 초기 상태로 설정)
        function resetToDefault() {
            denominator = 4;
            numerator = 3;
            isCompareMode = false;
            compareBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
            compareBtn.classList.replace('border-amber-700', 'border-emerald-700');
            compareBtn.textContent = '크기 비교';
            messageBox.textContent = '';
            updateUI();
        }

        // 초기 실행
        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
