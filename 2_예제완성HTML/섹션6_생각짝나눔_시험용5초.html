<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 3학년 과학 - 생각-짝-나눔 (자동 단계 전환)</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 폰트 설정 및 스크롤 방지 */
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            overflow: hidden; /* 스크롤 없이 한 화면 고정 */
        }
        /* 버튼 최소 크기 (2cm = 약 80px 이상의 높이 확보) */
        .min-btn-size {
            min-height: 80px;
            min-width: 180px;
        }
    </style>
</head>
<body id="page-body" class="bg-slate-900 text-white h-screen w-screen flex flex-col justify-between p-6 select-none transition-colors duration-500">

    <!-- 1. 위: 오늘의 목표 문장 + 오늘의 질문 -->
    <header class="flex flex-col items-center justify-center text-center space-y-3 pt-2">
        <!-- 오늘의 목표 (맨 위 한 문장으로 크게) -->
        <div id="target-box" class="bg-indigo-900/80 border border-indigo-400/50 rounded-2xl px-8 py-4 w-full max-w-5xl shadow-lg transition-colors duration-500">
            <p id="target-text" class="text-3xl md:text-4xl font-extrabold text-indigo-200 tracking-tight">
                🎯 목표: 자석이 쓰이는 곳을 찾아 짝에게 설명할 수 있어요
            </p>
        </div>
        
        <!-- 오늘의 질문 -->
        <div id="question-box" class="bg-slate-800/80 border border-slate-700 rounded-2xl px-8 py-4 w-full max-w-5xl shadow-md transition-colors duration-500">
            <h1 id="question-text" class="text-3xl md:text-4xl font-bold text-yellow-300">
                ❓ 질문: 우리 집과 교실에서 자석은 어디에 쓰일까요?
            </h1>
        </div>
    </header>

    <!-- 2. 가운데: 3단계 가로 배치 + 큰 숫자 + 가로 막대 -->
    <main class="flex flex-col items-center justify-center flex-1 my-2">
        
        <!-- 단계 이름 3개 가로 배치 (현재 단계만 진하게) -->
        <div class="grid grid-cols-3 gap-4 w-full max-w-5xl mb-6">
            <!-- 단계 1 -->
            <div id="step-1" class="rounded-2xl p-4 text-center border transition-all duration-300">
                <span class="text-3xl font-black block">🤔 단계 1</span>
                <span class="text-2xl font-bold">혼자 생각 (시험용 5초)</span>
            </div>
            
            <!-- 단계 2 -->
            <div id="step-2" class="rounded-2xl p-4 text-center border transition-all duration-300">
                <span class="text-3xl font-bold block">🗣️ 단계 2</span>
                <span class="text-2xl font-medium">짝과 이야기 (시험용 5초)</span>
            </div>
            
            <!-- 단계 3 -->
            <div id="step-3" class="rounded-2xl p-4 text-center border transition-all duration-300">
                <span class="text-3xl font-bold block">🙌 단계 3</span>
                <span class="text-2xl font-medium">다 같이 나눔 (시험용 5초)</span>
            </div>
        </div>

        <!-- 타이머 영역 (남은 시간 큰 숫자 + 가로 막대) -->
        <div id="timer-box" class="w-full max-w-5xl bg-slate-800/90 border border-slate-700 rounded-3xl p-6 flex flex-col items-center shadow-2xl transition-colors duration-500">
            <!-- 남은 시간 큰 숫자 / 완료 메시지 -->
            <div id="timer-display" class="text-7xl md:text-8xl font-black tracking-widest text-emerald-400 my-2 font-mono drop-shadow-md text-center">
                0:05
            </div>

            <!-- 가로 막대 (프로그레스 바) -->
            <div id="progress-container" class="w-full bg-slate-700 h-10 rounded-full overflow-hidden p-1 border border-slate-600">
                <div id="progress-bar" class="bg-emerald-400 h-full rounded-full transition-all duration-300 ease-linear" style="width: 100%;"></div>
            </div>

            <!-- 틀렸을 때 한 줄 메시지 표시 영역 -->
            <div id="error-message" class="h-8 mt-3 text-red-400 text-2xl font-bold text-center"></div>
        </div>
    </main>

    <!-- 3. 아래: 시작 버튼, 다시 하기 버튼 (2cm 이상 크기) -->
    <footer class="flex justify-center items-center gap-8 pb-4">
        <!-- 시작 버튼 -->
        <button id="start-btn" onclick="handleStart()" class="min-btn-size bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-3xl font-extrabold rounded-2xl px-10 border-b-4 border-emerald-800 shadow-lg flex items-center justify-center gap-2 cursor-pointer transition">
            ▶️ 시작
        </button>

        <!-- 다시 하기 버튼 -->
        <button id="reset-btn" onclick="handleReset()" class="min-btn-size bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white text-3xl font-extrabold rounded-2xl px-10 border-b-4 border-amber-800 shadow-lg flex items-center justify-center gap-2 cursor-pointer transition">
            🔄 다시 하기
        </button>
    </footer>

    <!-- 4. 자바스크립트 (자동 단계 전환 카운트다운 타이머) -->
    <script>
        // 각 단계 설정 (시험용: 모두 5초로 설정)
        const STEPS = [
            { id: 1, duration: 5, name: "단계 1" },
            { id: 2, duration: 5, name: "단계 2" },
            { id: 3, duration: 5, name: "단계 3" }
        ];

        let currentStepIndex = 0; // 0: 단계 1, 1: 단계 2, 2: 단계 3, 3: 모두 완료
        let remainingSeconds = STEPS[0].duration;
        let timerInterval = null;
        let isRunning = false;

        const pageBody = document.getElementById('page-body');
        const timerDisplayEl = document.getElementById('timer-display');
        const progressBarEl = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const errorMessageEl = document.getElementById('error-message');
        const targetBox = document.getElementById('target-box');
        const targetText = document.getElementById('target-text');
        const questionBox = document.getElementById('question-box');
        const questionText = document.getElementById('question-text');
        const timerBox = document.getElementById('timer-box');

        const stepEls = [
            document.getElementById('step-1'),
            document.getElementById('step-2'),
            document.getElementById('step-3')
        ];

        function showError(msg) {
            errorMessageEl.textContent = msg;
        }

        function clearError() {
            errorMessageEl.textContent = '';
        }

        // 단계 및 시간/막대 시각 업데이트
        function updateUI() {
            // 모든 단계 완료 상태 체크
            if (currentStepIndex >= STEPS.length) {
                // 다 끝나면 화면 바탕을 연한 노랑으로 변경하고 완료 문구 표시
                pageBody.className = "bg-yellow-100 text-slate-900 h-screen w-screen flex flex-col justify-between p-6 select-none transition-colors duration-500";
                
                // 목표 및 질문 상자 색상 변경 (대비 확보)
                targetBox.className = "bg-amber-200 border border-amber-400 rounded-2xl px-8 py-4 w-full max-w-5xl shadow-lg";
                targetText.className = "text-3xl md:text-4xl font-extrabold text-amber-900 tracking-tight";
                questionBox.className = "bg-amber-100 border border-amber-300 rounded-2xl px-8 py-4 w-full max-w-5xl shadow-md";
                questionText.className = "text-3xl md:text-4xl font-bold text-amber-800";
                
                timerBox.className = "w-full max-w-5xl bg-white border-2 border-amber-400 rounded-3xl p-6 flex flex-col items-center shadow-2xl";
                
                // 완료 메시지 (큰 글씨)
                timerDisplayEl.textContent = "🎉 끝! 발표할 준비";
                timerDisplayEl.className = "text-5xl md:text-7xl font-black text-amber-900 my-6 tracking-tight drop-shadow-sm text-center";
                
                // 막대 숨김 처리
                progressContainer.classList.add('hidden');

                // 모든 단계 비활성화 표시 (글자+디자인)
                stepEls.forEach((el, idx) => {
                    el.className = "bg-amber-200/60 text-slate-700 rounded-2xl p-4 text-center border border-amber-300 opacity-70";
                });
                return;
            }

            // 일반 상태 (다크 테마)
            pageBody.className = "bg-slate-900 text-white h-screen w-screen flex flex-col justify-between p-6 select-none transition-colors duration-500";
            targetBox.className = "bg-indigo-900/80 border border-indigo-400/50 rounded-2xl px-8 py-4 w-full max-w-5xl shadow-lg";
            targetText.className = "text-3xl md:text-4xl font-extrabold text-indigo-200 tracking-tight";
            questionBox.className = "bg-slate-800/80 border border-slate-700 rounded-2xl px-8 py-4 w-full max-w-5xl shadow-md";
            questionText.className = "text-3xl md:text-4xl font-bold text-yellow-300";
            timerBox.className = "w-full max-w-5xl bg-slate-800/90 border border-slate-700 rounded-3xl p-6 flex flex-col items-center shadow-2xl";

            progressContainer.classList.remove('hidden');

            // 1. 단계 카드 강조 업데이트 (색 뿐만 아니라 진하게/크기 및 진행상태 글자로 구분)
            stepEls.forEach((el, idx) => {
                if (idx === currentStepIndex) {
                    // 현재 진행 단계 (진하고 크게 강조 + 테두리)
                    el.className = "bg-blue-600 text-white rounded-2xl p-4 text-center border-4 border-yellow-400 shadow-xl scale-105 font-black";
                } else {
                    // 비활성 단계 (연하게)
                    el.className = "bg-slate-800 text-slate-400 rounded-2xl p-4 text-center border border-slate-700 opacity-60 font-normal";
                }
            });

            // 2. 남은 시간 큰 숫자 업데이트
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const formattedTime = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            timerDisplayEl.textContent = formattedTime;
            timerDisplayEl.className = "text-8xl md:text-9xl font-black tracking-widest text-emerald-400 my-2 font-mono drop-shadow-md text-center";

            // 3. 막대(프로그레스 바) 비율 계산 및 업데이트
            const totalDuration = STEPS[currentStepIndex].duration;
            const percentage = (remainingSeconds / totalDuration) * 100;
            progressBarEl.style.width = `${percentage}%`;
        }

        // 이전 단계 타이머 안전 종료
        function stopCurrentTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // 1초 단위 카운트다운 진행 함수
        function runTimer() {
            stopCurrentTimer();
            isRunning = true;

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateUI();

                // 현재 단계 완료 시
                if (remainingSeconds <= 0) {
                    stopCurrentTimer();
                    
                    // 다음 단계로 전환
                    currentStepIndex++;
                    
                    if (currentStepIndex < STEPS.length) {
                        // 다음 단계의 시간으로 설정 후 즉시 이어서 시작
                        remainingSeconds = STEPS[currentStepIndex].duration;
                        updateUI();
                        runTimer();
                    } else {
                        // 3단계까지 모두 완료
                        isRunning = false;
                        updateUI();
                    }
                }
            }, 1000);
        }

        // 시작 버튼 작동
        function handleStart() {
            clearError();

            if (currentStepIndex >= STEPS.length) {
                showError('⚠️ 활동이 모두 끝났어요! [다시 하기] 버튼을 눌러주세요.');
                return;
            }

            if (isRunning) {
                showError('⚠️ 타이머가 이미 가고 있어요!');
                return;
            }

            runTimer();
        }

        // 다시 하기 버튼 작동 (첫 단계 1:00으로 되돌아가고 멈춤)
        function handleReset() {
            clearError();
            stopCurrentTimer();

            isRunning = false;
            currentStepIndex = 0;
            remainingSeconds = STEPS[0].duration;
            
            updateUI();
        }

        // 초기 화면 로드 시 UI 설정
        updateUI();
    </script>
</body>
</html>
