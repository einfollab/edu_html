<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 국어</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 초등학교 1학년 가독성을 위한 기본 폰트 설정 및 화면 고정 */
        body {
            font-family: 'Malgun Gothic', 'Nanum Gothic', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 스크롤 없이 한 화면에 딱 맞게 고정 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #F8FAFC;
        }

        /* 32px 이상의 시원하고 큰 글씨 설정 */
        .text-32px {
            font-size: clamp(32px, 3.5vw, 44px);
        }

        .text-goal {
            font-size: clamp(36px, 4.5vw, 56px);
        }

        /* TV 화면용 초대형 버튼 스타일 (최소 2cm = 약 80px 이상, 충분히 크고 선명하게) */
        .btn-xl {
            min-height: 180px;
            font-size: clamp(36px, 4vw, 52px);
            border-width: 6px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn-xl:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center p-6 lg:p-10 text-slate-800">

    <!-- [상단] 제목 및 오늘의 목표 (가장 크게 한 문장으로 표시) -->
    <header class="w-full text-center flex flex-col items-center mt-2">
        <!-- 제목 -->
        <h1 class="text-32px font-bold text-slate-500 mb-3 tracking-tight">
            오늘의 국어
        </h1>
        
        <!-- 목표 (맨 위에 크게 표시) -->
        <div class="w-full max-w-6xl bg-amber-100 border-4 border-amber-300 rounded-3xl p-6 shadow-sm">
            <p class="text-goal font-extrabold text-slate-900 leading-tight break-keep">
                받침 없는 글자를 바르게 읽고 쓸 수 있어요
            </p>
        </div>
    </header>

    <!-- [중앙] 그림 버튼 3개 (가로로 나란히 배치) -->
    <main class="w-full max-w-6xl my-auto">
        <div class="grid grid-cols-3 gap-6 lg:gap-10 w-full">
            
            <!-- 버튼 1: 알아요 -->
            <button type="button" class="btn-xl bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-3xl border-emerald-600 shadow-lg flex flex-col md:flex-row items-center justify-center gap-4 px-4">
                <span>😀</span>
                <span class="whitespace-nowrap">알아요</span>
            </button>

            <!-- 버튼 2: 조금 -->
            <button type="button" class="btn-xl bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-bold rounded-3xl border-sky-600 shadow-lg flex flex-col md:flex-row items-center justify-center gap-4 px-4">
                <span>🤔</span>
                <span class="whitespace-nowrap">조금</span>
            </button>

            <!-- 버튼 3: 몰라요 -->
            <button type="button" class="btn-xl bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-bold rounded-3xl border-rose-600 shadow-lg flex flex-col md:flex-row items-center justify-center gap-4 px-4">
                <span>😥</span>
                <span class="whitespace-nowrap">몰라요</span>
            </button>

        </div>
    </main>

    <!-- [하단] 다시 하기 버튼 -->
    <footer class="w-full text-center mb-2">
        <button type="button" class="bg-slate-300 hover:bg-slate-400 text-slate-800 font-bold text-32px px-12 py-4 rounded-2xl border-2 border-slate-400 active:bg-slate-500 transition-colors">
            다시 하기
        </button>
    </footer>

</body>
</html>
